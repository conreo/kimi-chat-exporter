name: Lint, Security & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JS syntax
        run: |
          node -c background.js && echo "[OK] background.js"
          node -c popup.js && echo "[OK] popup.js"
          node -c content.js && echo "[OK] content.js"

      - name: Run unit tests
        run: node tests/test.js

      - name: Validate manifest.json
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8'));console.log('[OK] manifest.json v'+m.manifest_version)"

      - name: Install web-ext
        run: npm install -g web-ext

      - name: web-ext lint
        run: web-ext lint --source-dir .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for dangerous patterns
        run: |
          echo "::group::No eval()"
          if grep -rq 'eval(' *.js; then echo "FAIL: eval() found"; exit 1; else echo "PASS"; fi
          echo "::endgroup::"

          echo "::group::No document.write"
          if grep -rq 'document\.write' *.js; then echo "FAIL: document.write found"; exit 1; else echo "PASS"; fi
          echo "::endgroup::"

          echo "::group::No secrets (JWT tokens)"
          if grep -rqE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' *.js manifest.json; then echo "FAIL: JWT token found"; exit 1; else echo "PASS"; fi
          echo "::endgroup::"

      - name: Check file permissions
        run: |
          find . -type f -perm /111 ! -name "*.sh" ! -path "./.git/*" | (grep . && echo "FAIL: unexpected executable files" && exit 1 || echo "PASS")

  package:
    needs: [lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package .xpi
        run: |
          zip -r kimi-chat-exporter.xpi \
            manifest.json background.html background.js content.js \
            popup.html popup.css popup.js icons/ LICENSE README.md \
            -x ".git/*" ".github/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimi-chat-exporter
          path: kimi-chat-exporter.xpi

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: kimi-chat-exporter.xpi
